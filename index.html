<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>льоля • bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #000000;
            --card: rgba(12, 12, 12, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.3);
            --text: #ffffff;
            --muted: #888888;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 0);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        .container {
            width: min(440px, calc(100% - 24px));
            padding: 44px 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 36px;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 50px 140px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            opacity: 0;
            transform: translateY(25px) scale(0.96);
            animation: showCard 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 2;
        }

        @keyframes showCard {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 22px;
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.02));
            z-index: -1;
            filter: blur(6px);
            opacity: 0.7;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.96); opacity: 0.4; }
            100% { transform: scale(1.04); opacity: 0.8; }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid #000;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container:hover .avatar {
            transform: scale(1.04) rotate(2deg);
        }

        .name { 
            font-size: 32px; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            color: #fff;
        }

        .taken-by {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }

        .encrypted {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            letter-spacing: 1px;
            font-family: monospace;
        }

        .encrypted:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .usernames-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 16px 0 20px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tag:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .marketplace-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            text-align: center;
            transition: 0.3s ease;
        }

        .marketplace-box:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.035);
        }

        .marketplace-box p {
            font-size: 12.5px;
            color: #999999;
            line-height: 1.5;
            font-weight: 500;
        }

        .marketplace-box span {
            color: #ffffff;
            font-weight: 700;
        }

        .links { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            border: 1px solid var(--border);
            border-radius: 18px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.025);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transform: translateX(-100%);
            transition: 0.7s ease;
        }

        .link:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .link:hover::before { transform: translateX(100%); }

        .status-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 28px;
            font-size: 11.5px;
            color: #777;
            font-weight: 600;
        }

        .status { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 50%; 
            background: #fff; 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 16px rgba(255, 255, 255, 1); }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .views-counter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 8px;
            color: #888;
            font-family: monospace;
        }

        .footer { 
            margin-top: 14px; 
            color: #444; 
            font-size: 10.5px; 
            font-weight: 500;
        }
    </style>
</head>

            particle.classList.add('particle');

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;

            particlesContainer.appendChild(particle);
        }

        const secret = document.getElementById('secretText');
        const original = '???????';
        const hidden = secret.getAttribute('data-hidden');
        secret.addEventListener('mouseenter', () => secret.textContent = hidden);
        secret.addEventListener('mouseleave', () => secret.textContent = original);
        secret.addEventListener('click', () => {
            secret.textContent = secret.textContent === original ? hidden : original;
        });

        fetch('https://api.counterapi.dev/v1/kaneki57992/bio/hit')
            .then(res => res.json())
            .then(data => {
                document.getElementById('viewCount').textContent = 'views: ' + data.count;

            .catch(() => {

            });

</html>
