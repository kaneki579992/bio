<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>льоля • bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        :root {
            --bg: #050505;
            --card: #101014;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.7);
            --text-secondary: #9a9a9a;
            --text-tertiary: #555;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 2000px;
        }

        /* Чистый, глубокий фон с центральным свечением */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            z-index: 0;
            animation: breathe 8s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* ==================== КАРТОЧКА ==================== */
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(460px, calc(100% - 24px));
            padding: 56px 44px;
            background: rgba(16, 16, 20, 0.7);
            border: 1px solid var(--border);
            border-radius: 42px;
            box-shadow: 0 50px 120px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            will-change: transform;
            z-index: 10;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            
            opacity: 0;
            transform: translateY(100px) scale(0.8) rotateX(20deg);
            animation: superShow 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes superShow {
            0% { opacity: 0; transform: translateY(120px) scale(0.6) rotateX(35deg); filter: blur(20px); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0); }
        }

        /* Тонкая, элегантная рамка при наведении */
        .container::before {
            content: ''; position: absolute; inset: -1px; border-radius: 43px;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            background-size: 200% 200%; animation: borderShift 10s linear infinite;
            opacity: 0; transition: opacity 0.8s ease; z-index: -1; filter: blur(2px);
        }
        .container:hover::before { opacity: 1; }
        @keyframes borderShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        /* ==================== АВАТАР ==================== */
        .avatar-container { position: relative; width: 140px; height: 140px; margin-bottom: 30px; transform: translateZ(60px); }
        .avatar-ring {
            position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.2);
            animation: spinRing 10s linear infinite;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .avatar-ring::after { content: ''; position: absolute; top: -4px; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #fff; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 3px solid rgba(255, 255, 255, 0.1); background: #111; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.8s; }
        .container:hover .avatar { transform: scale(1.08) rotate(3deg); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 50px rgba(255, 255, 255, 0.2); }

        /* ==================== ТЕКСТ ==================== */
        h1.name { font-size: 46px; font-weight: 900; letter-spacing: -2px; background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; transform: translateZ(50px); animation: floatText 6s infinite alternate ease-in-out; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5)); }
        @keyframes floatText { 0% { transform: translateZ(50px) translateY(0px); } 100% { transform: translateZ(50px) translateY(-10px); } }

        .taken-by { font-size: 14px; color: var(--text-secondary); margin-bottom: 40px; transform: translateZ(40px); animation: fadeSlideUp 1s 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

        .encrypted { color: #fff; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 14px; border-radius: 12px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 2px; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .encrypted:hover { background: rgba(255, 255, 255, 0.1); border-color: #fff; transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.2); }

        /* ==================== НИКИ (Премиальный стиль "Стекло") ==================== */
        .usernames-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            transform: translateZ(50px);
            animation: fadeSlideUp 1s 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            position: relative;
            z-index: 100;
        }

        .tag-wrapper { position: relative; }

        .tag {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            color: #fff;
            text-decoration: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            background: rgba(30, 30, 40, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tag::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tag-wrapper:hover .tag {
            transform: translateY(-8px) scale(1.1);
            color: #000;
            border-color: #fff;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .tag-wrapper:hover .tag::after { transform: translateX(100%); }

        /* ==================== ТУЛТИП С ЦЕНОЙ ==================== */
        .price-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.4);
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 6px 16px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 999;
            white-space: nowrap;
            backdrop-filter: blur(5px);
        }

        .tag-wrapper:hover .price-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        /* ==================== ИНФО-БОКС ==================== */
        .marketplace-box { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 20px; 
            margin-bottom: 40px; 
            text-align: center; 
            transform: translateZ(40px); 
            animation: fadeSlideUp 1s 1.2s cubic-bezier(0.16, 1, 0.3, 1) backwards; 
            position: relative; 
            overflow: hidden; 
        }
        
        .marketplace-box::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: -150%; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); 
            transition: 1.5s ease; 
        }
        
        .marketplace-box:hover::before { left: 150%; }

        .lang-switch {
            position: absolute;
            top: 10px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3px;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .lang-switch:hover { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
        
        .lang-btn { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; color: #888; transition: all 0.3s ease; font-family: 'JetBrains Mono', monospace; }
        .lang-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }

        .marketplace-text { padding-top: 15px; transition: opacity 0.4s ease, transform 0.4s ease; }
        .marketplace-box p { font-size: 14px; color: var(--text-tertiary); line-height: 1.6; font-weight: 500; }
        .marketplace-box span { color: #fff; font-weight: 800; text-shadow: 0 0 20px rgba(255,255,255,0.3); }

        /* ==================== КНОПКИ ==================== */
        .links { display: flex; flex-direction: column; gap: 16px; width: 100%; transform: translateZ(50px); animation: fadeSlideUp 1s 1.4s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        .link { 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 65px; 
            border: 1px solid var(--border); 
            border-radius: 22px; 
            color: #fff; 
            text-decoration: none; 
            font-size: 18px; 
            font-weight: 800; 
            background: rgba(255, 255, 255, 0.03); 
            overflow: hidden; 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }
        .link::before { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%); transform: translateX(-150%); transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .link:hover { border-color: #fff; background: #fff; color: #000; transform: translateY(-10px) scale(1.03); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 255, 255, 0.4); }
        .link:hover::before { transform: translateX(150%); }

        /* ==================== СТАТУС ==================== */
        .status-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-tertiary); font-weight: 700; transform: translateZ(40px); animation: fadeSlideUp 1s 1.6s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        .status { display: flex; align-items: center; gap: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 20px #22c55e; animation: pulseDot 1.5s infinite; }
        @keyframes pulseDot { 0%, 100% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 40px #22c55e; } }
        .views-counter { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); padding: 8px 14px; border-radius: 12px; letter-spacing: 1px; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateZ(40px) translateY(30px); } to { opacity: 1; transform: translateZ(40px) translateY(0); } }

        @media (max-width: 480px) {
            .container { padding: 40px 24px; border-radius: 32px; }
            h1.name { font-size: 36px; }
            .tag { min-width: 65px; padding: 10px; font-size: 14px; }
            .link { font-size: 16px; }
        }
    </style>
</head>
<body>

    <main class="container" id="mainCard">
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <img class="avatar" src="avatar.png" alt="льоля" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjUwIiBmaWxsPSIjMjIyIi8+PHRleHQgeD0iNTAlIiB5PSI1NSUiIGZvbnQtc2l6ZT0iNDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmZmYiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC13ZWlnaHQ9ImJvbGQiPkw8L3RleHQ+PC9zdmc+';">
        </div>
        
        <h1 class="name">льоля</h1>
        <div class="taken-by">Taken by <span class="encrypted" id="secretText">$&@#(!*</span></div>
        
        <!-- НИКИ -->
        <div class="usernames-grid">
            
            <!-- tk6i: Цена 5$ -->
            <div class="tag-wrapper">
                <div class="price-tooltip">$5</div>
                <a href="https://shopusernames.com/discord/@tk6i" target="_blank" class="tag">@tk6i</a>
            </div>

            <!-- r8hz: Цена 50$ -->
            <div class="tag-wrapper">
                <div class="price-tooltip">$50</div>
                <a href="https://shopusernames.com/discord/@r8hz" target="_blank" class="tag">@r8hz</a>
            </div>

            <!-- u1w0: Цена 499$ -->
            <div class="tag-wrapper">
                <div class="price-tooltip">$499</div>
                <a href="https://shopusernames.com/discord/@u1w0" target="_blank" class="tag">@u1w0</a>
            </div>

            <!-- 08v8: Цена 999$ -->
            <div class="tag-wrapper">
                <div class="price-tooltip">$999</div>
                <a href="https://shopusernames.com/discord/@08v8" target="_blank" class="tag">@08v8</a>
            </div>

        </div>

        <!-- ИНФО-БОКС С ПЕРЕКЛЮЧАТЕЛЕМ -->
        <div class="marketplace-box">
            <div class="lang-switch" onclick="toggleLang()">
                <div class="lang-btn active" id="btnRu">RU</div>
                <div class="lang-btn" id="btnEn">EN</div>
            </div>
            
            <div class="marketplace-text" id="marketplaceText">
                <p>Это все <span>Дискорд никнеймы</span>. Если вы хотите приобрести, то пишите в ЛС.</p>
            </div>
        </div>
        
        <nav class="links">
            <a class="link" href="https://discord.com/users/1274857992784969831" target="_blank"><span>Discord DM</span></a>
            <a class="link" href="https://t.me/wipchick" target="_blank"><span>Telegram</span></a>
        </nav>

        <div class="status-row">
            <div class="status">
                <span class="dot"></span>
                <span>online</span>
            </div>
            <div class="views-counter" id="viewCount">views: 135</div>
        </div>
    </main>

    <script>
        // Переключатель языка
        let currentLang = 'ru';
        const textRu = 'Это все <span>Дискорд никнеймы</span>. Если вы хотите приобрести, то пишите в ЛС.';
        const textEn = 'All of these are <span>Discord usernames</span>. If you are interested in buying, feel free to reach out in DM.';
        
        function toggleLang() {
            const btnRu = document.getElementById('btnRu');
            const btnEn = document.getElementById('btnEn');
            const textBlock = document.getElementById('marketplaceText');
            
            if (currentLang === 'ru') {
                currentLang = 'en';
                btnRu.classList.remove('active');
                btnEn.classList.add('active');
                textBlock.style.opacity = '0';
                textBlock.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    textBlock.innerHTML = textEn;
                    textBlock.style.opacity = '1';
                    textBlock.style.transform = 'translateY(0)';
                }, 250);
            } else {
                currentLang = 'ru';
                btnEn.classList.remove('active');
                btnRu.classList.add('active');
                textBlock.style.opacity = '0';
                textBlock.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    textBlock.innerHTML = textRu;
                    textBlock.style.opacity = '1';
                    textBlock.style.transform = 'translateY(0)';
                }, 250);
            }
        }

        // 3D наклон карточки
        const card = document.getElementById('mainCard');
        window.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `rotateX(${(-y / (rect.height / 2)) * 10}deg) rotateY(${(x / (rect.width / 2)) * 10}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            card.style.transition = 'transform 1s cubic-bezier(0.16, 1, 0.3, 1)';
        });

        card.addEventListener('mouseenter', () => {
            card.style.transition = 'transform 0.1s ease-out';
        });

        // Секретный текст
        const secret = document.getElementById('secretText');
        const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`';
        let isHovered = false;
        
        setInterval(() => {
            if (!isHovered) {
                let res = '';
                for (let i = 0; i < 7; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
                secret.textContent = res;
            }
        }, 120);

        secret.addEventListener('mouseenter', () => { isHovered = true; secret.textContent = 'secured'; });
        secret.addEventListener('mouseleave', () => { isHovered = false; });

        // Счётчик просмотров
        let views = parseInt(localStorage.getItem('site_views')) || 135;
        if (!sessionStorage.getItem('counted_session')) {
            views++;
            localStorage.setItem('site_views', views);
            sessionStorage.setItem('counted_session', 'true');
        }
        document.getElementById('viewCount').textContent = 'views: ' + views;
    </script>
</body>
</html>
