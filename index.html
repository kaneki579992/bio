<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        :root {
            --bg: #000000;
            --card: rgba(12, 12, 16, 0.9);
            --border-hover: rgba(255, 255, 255, 0.45);
            --online: #ffffff;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1400px;
            position: relative;
        }

        /* Фоновые летающие частицы */
        .particles-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) translateX(60px) scale(1.2);
                opacity: 0;
            }
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            z-index: 999;
            background-size: 100% 3px;
            pointer-events: none;
            opacity: 0.25;
        }

        .cursor-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 45%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
        }

        .container {
            position: relative;
            display: flex;
            gap: 36px;
            align-items: center;
            width: min(840px, calc(100% - 24px));
            padding: 44px 38px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 37px;
            backdrop-filter: blur(70px);

            transform-style: preserve-3d;

            z-index: 5;
            will-change: transform;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: showCard 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        @keyframes showCard {
            to { opacity: 1; transform: translateY(0) scale(1); }

        .profile-side {
            width: 340px;

        .avatar-container {

            margin: 0 auto 20px;
            transform: translateZ(40px);

        .avatar {
            width: 100%;

            border-radius: 50%;
            object-fit: cover;
            display: block;

        .container:hover .avatar {

        .name {

        .marketplace-box {

        .marketplace-box p {

        .marketplace-box span {
            color: #ffffff;
            font-weight: 700;

        .links { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            transform: translateZ(30px);

        .link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;

            font-size: 13.5px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.025);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);

        }

        .link::before {
            content: "";
            position: absolute;
            inset: 0;

            transform: translateX(-100%);

        .link:hover {
            transform: translateY(-3px) scale(1.015);
            border-color: var(--border-hover);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.08);
        }

        .link:hover::before { transform: translateX(100%); }

        .status-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            font-size: 11.5px;
            color: #666;

            transform: translateZ(20px);
        }

        .status { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: var(--online); 
            box-shadow: 0 0 12px var(--online);
            animation: pulseDot 1.8s infinite;

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 20px var(--online); }
            100% { transform: scale(0.9); opacity: 0.5; }
        }

        .views-counter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 8px;
            color: #777;
            font-family: monospace;
        }

        .minesweeper-side {
            width: 350px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateZ(35px);
        }

        .minesweeper-header {
            font-size: 11.5px;
            font-weight: 700;
            color: #777;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 2px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .minesweeper-grid {
            display: grid;
            grid-template-columns: repeat(12, 24px);
            grid-template-rows: repeat(12, 24px);
            gap: 3px;
        }

        .mine-cell {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11.5px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
            color: #fff;
        }

        .mine-cell:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
            z-index: 2;
        }

        .mine-cell.revealed {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.02);
            cursor: default;
            transform: none !important;
        }

        .mine-cell.mine {
            background: rgba(255, 60, 60, 0.18);
            border-color: rgba(255, 60, 60, 0.4);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 30px 20px; }
            .minesweeper-side { width: 100%; }
        }
    </style>
</head>

    <script>
        const particlesContainer = document.getElementById('particlesBg');
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 4}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.addEventListener('pointerdown', () => {
            getAudioContext();
        }, { once: true });

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx || ctx.state !== 'running') return;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'global_click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.03);
                    gain.gain.setValueAtTime(0.025, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.03);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.03);
                    osc.start(now);
                    osc.stop(now + 0.03);
                } else if (type === 'flag') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.04);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'boom') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.linearRampToValueAtTime(20, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {}
        }

        // Звук при наведении только на кнопки, теги и секретный текст (без ячеек сапера)
        document.querySelectorAll('.link, .tag, .encrypted').forEach(el => {
            el.addEventListener('mouseenter', () => playSound('hover'));
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) playSound('global_click');
        });

        const rows = 12;
        const cols = 12;
        const totalMines = 20;
        const gridEl = document.getElementById('minesweeperGrid');
        const statusEl = document.getElementById('mineStatus');
        
        let board = [];
        let gameOver = false;
        let minesLeft = totalMines;
        let firstClick = true;

        function initMinesweeper() {
            gridEl.innerHTML = '';
            board = [];
            gameOver = false;
            firstClick = true;
            minesLeft = totalMines;
            statusEl.textContent = minesLeft;

            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({ r, c, mine: false, revealed: false, flagged: false, neighbor: 0, el: null });
                }
                board.push(row);
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let cellDiv = document.createElement('div');
                    cellDiv.className = 'mine-cell';
                    
                    // Убрали добавление звука hover на ячейки
                    cellDiv.addEventListener('click', () => clickCell(r, c));
                    cellDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        flagCell(r, c);
                    });

                    board[r][c].el = cellDiv;
                    gridEl.appendChild(cellDiv);
                }
            }

            setTimeout(() => {
                clickCell(Math.floor(rows / 2), Math.floor(cols / 2));
            }, 50);
        }

        function placeMines(safeR, safeC) {
            let placed = 0;
            while (placed < totalMines) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                let dist = Math.abs(r - safeR) + Math.abs(c - safeC);
                if (dist <= 1) continue;

                if (!board[r][c].mine) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighbor = count;
                }
            }
        }

        function flagCell(r, c) {
            if (gameOver) return;
            let cell = board[r][c];
            if (cell.revealed) return;

            cell.flagged = !cell.flagged;
            if (cell.flagged) {
                cell.el.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>';
                cell.el.style.color = '#f472b6';
                minesLeft--;
                playSound('flag');
            } else {
                cell.el.innerHTML = '';
                minesLeft++;
            }
            statusEl.textContent = minesLeft;
        }

        function clickCell(r, c) {
            if (gameOver) {
                initMinesweeper();
                return;
            }

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
            }

            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            let queue = [[r, c]];
            let openedAny = false;

            while (queue.length > 0) {
                let [currR, currC] = queue.shift();
                let currentCell = board[currR][currC];

                if (currentCell.revealed || currentCell.flagged) continue;

                currentCell.revealed = true;
                currentCell.el.classList.add('revealed');
                openedAny = true;

                if (currentCell.mine) {
                    currentCell.el.classList.add('mine');
                    currentCell.el.innerHTML = '×';
                    currentCell.el.style.color = '#ff4444';
                    gameOver = true;
                    statusEl.textContent = '×';
                    playSound('boom');
                    for (let row of board) {
                        for (let cl of row) {
                            if (cl.mine) {
                                cl.el.classList.add('revealed', 'mine');
                                cl.el.innerHTML = '×';
                                cl.el.style.color = '#ff4444';
                            }
                        }
                    }
                    setTimeout(initMinesweeper, 2000);
                    return;
                }

                if (currentCell.neighbor > 0) {
                    currentCell.el.textContent = currentCell.neighbor;
                    const colors = ['', '#818cf8', '#34d399', '#f472b6', '#a78bfa', '#fbbf24', '#22d3ee', '#f87171', '#fff'];
                    currentCell.el.style.color = colors[currentCell.neighbor] || '#fff';
                } else {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = currR + dr, nc = currC + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                                if (!board[nr][nc].revealed && !board[nr][nc].flagged) {
                                    queue.push([nr, nc]);
                                }
                            }
                        }
                    }
                }
            }

            if (openedAny) {
                playSound('click');
            }

            let win = true;
            for (let row of board) {
                for (let cl of row) {
                    if (!cl.mine && !cl.revealed) win = false;
                }
            }
            if (win) {
                gameOver = true;
                statusEl.textContent = '✓';
                playSound('win');
                setTimeout(initMinesweeper, 2000);
            }
        }

        initMinesweeper();

        const card = document.getElementById('glowCard');
        window.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `perspective(1400px) rotateX(${(-y / (rect.height / 2)) * 5}deg) rotateY(${(x / (rect.width / 2)) * 5}deg) translateY(-3px)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1400px) rotateX(0deg) rotateY(0deg) translateY(0px)';
            card.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        });

        card.addEventListener('mouseenter', () => { card.style.transition = 'none'; });

        const cursorLight = document.getElementById('cursorLight');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2, currentX = mouseX, currentY = mouseY;
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

        function updateCursor() {
            currentX += (mouseX - currentX) * 0.12;
            currentY += (mouseY - currentY) * 0.12;
            cursorLight.style.left = `${currentX}px`;
            cursorLight.style.top = `${currentY}px`;
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        const secret = document.getElementById('secretText');
        const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`§±';
        let isHovered = false;
        
        setInterval(() => {
            if (!isHovered) {
                let res = '';
                for (let i = 0; i < 7; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
                secret.textContent = res;
            }
        }, 110);

        secret.addEventListener('mouseenter', () => { isHovered = true; secret.textContent = 'secured'; });
        secret.addEventListener('mouseleave', () => { isHovered = false; });

        let views = parseInt(localStorage.getItem('site_views')) || 135;
        if (!sessionStorage.getItem('counted_session')) {
            views++;
            localStorage.setItem('site_views', views);
            sessionStorage.setItem('counted_session', 'true');
        }
        document.getElementById('viewCount').textContent = 'views: ' + views;
    </script>
</body>
</html>
